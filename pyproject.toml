[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-arb-data"
version = "0.1.0"
description = "Yahoo Finance data ingestion for the statistical-arbitrage replication project"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "tqdm>=4.66,<5",
    "yfinance>=0.2.54,<2",
]

[project.scripts]
stat-arb-data = "stat_arb_data.cli:main"
stat-arb-preprocessing = "stat_arb_preprocessing.cli:main"
stat-arb-cluster-count = "stat_arb_cluster_count.cli:main"
stat-arb-clustering = "stat_arb_clustering.cli:main"
stat-arb-stock-selection = "stat_arb_stock_selection.cli:main"
stat-arb-portfolio-weights = "stat_arb_portfolio_weights.cli:main"
stat-arb-backtest = "stat_arb_backtest.cli:main"
stat-arb-grid-backtest = "stat_arb_grid_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
